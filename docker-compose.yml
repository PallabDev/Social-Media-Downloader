services:
  social-dl:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8733:8733"
    volumes:
      - downloads:/app/downloads
    environment:
      - NODE_ENV=production
      - DOWNLOAD_DIR=/app/downloads
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8733"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 10s

volumes:
  downloads:
