services:
  social-dl:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8733:8733"
    volumes:
      - downloads:/app/downloads
    environment:
      - NODE_ENV=production
      - DOWNLOAD_DIR=/app/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8733"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  downloads:
