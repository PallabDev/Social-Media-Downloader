services:
  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    ports:
      - "4416:4416"
    restart: unless-stopped

  social-dl:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8733:8733"
    depends_on:
      - bgutil-pot
    volumes:
      - downloads:/app/downloads
      - cookies:/tmp
      - logs:/app/logs
    environment:
      - NODE_ENV=production
      - DOWNLOAD_DIR=/app/downloads
      - LOG_DIR=/app/logs
      - LOG_LEVEL=info
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8733"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 10s

volumes:
  downloads:
  cookies:
  logs:
